name: Build Android APK

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'debug'
        type: choice
        options: [debug, release]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pillow pylint pytest pytest-cov

      - name: Run pylint
        run: pylint config.py utils.py image_compressor.py --exit-zero

      - name: Run tests
        run: pytest test_image_compressor.py -v --cov=image_compressor --cov-report=term-missing --cov-fail-under=80

  build:
    needs: test
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Build Debug APK (with retry)
        if: github.event.inputs.release_type != 'release' && !startsWith(github.ref, 'refs/tags/')
        run: |
          for attempt in 1 2 3; do
            echo "=========================================="
            echo "🔨 构建尝试 $attempt/3"
            echo "=========================================="
            if yes | buildozer -v android debug; then
              echo "✅ 构建成功！"
              exit 0
            fi
            echo "❌ 尝试 $attempt 失败"
            if [ $attempt -lt 3 ]; then
              echo "⏳ 等待 30 秒后重试..."
              sleep 30
            fi
          done
          echo "❌ 3 次尝试均失败"
          exit 1

      - name: Build Release APK (with retry)
        if: github.event.inputs.release_type == 'release' || startsWith(github.ref, 'refs/tags/')
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE }}" | base64 -d > keystore.jks
          export BUILDOZER_RELEASE_KEYSTORE=keystore.jks
          export BUILDOZER_RELEASE_KEYSTORE_PASSWORD="${{ secrets.SIGNING_KEYSTORE_PASSWORD }}"
          export BUILDOZER_RELEASE_KEYALIAS="${{ secrets.SIGNING_KEY_ALIAS }}"
          export BUILDOZER_RELEASE_KEYALIAS_PASSWORD="${{ secrets.SIGNING_KEY_ALIAS_PASSWORD }}"
          for attempt in 1 2 3; do
            echo "=========================================="
            echo "🔨 构建尝试 $attempt/3"
            echo "=========================================="
            if yes | buildozer -v android release; then
              echo "✅ 构建成功！"
              exit 0
            fi
            echo "❌ 尝试 $attempt 失败"
            if [ $attempt -lt 3 ]; then
              echo "⏳ 等待 30 秒后重试..."
              sleep 30
            fi
          done
          echo "❌ 3 次尝试均失败"
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: bin/*.apk
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: bin/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
